<!DOCTYPE html>
<html lang="en">
<head>
<style>
body {
    background-color: #0a0f1d;
    color: #e2e8f0;
}
.theme-light {
    filter: invert(1) hue-rotate(180deg);
    background-color: #0a0f1d; /* same background to invert */
}
.theme-light img, .theme-light video {
    filter: invert(1) hue-rotate(180deg);
}
</style>
</head>
<body class="theme-light">
    <div>Testing dark to light</div>
</body>
</html>
